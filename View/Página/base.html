<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block titulo %}O Guardião dos Dados{% endblock %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='13') }}">
    </head>
    <body class="{% block classe_body %}tela-interna{% endblock %}">
        {% block corpo %}
        <header class="topo">
            <a href="{{ url_for('menu.inicio') }}" class="link-voltar">&larr; Menu</a>
            <span class="topo-titulo">{% block topo_titulo %}{% endblock %}</span>
            <span>{% block topo_direita %}{% endblock %}</span>
        </header>
        {% block abaixo_topo %}{% endblock %}
        <main class="conteudo">
            {% block conteudo %}{% endblock %}
        </main>
        {% endblock %}

        <dialog id="dialogo-confirmacao" class="dialogo" aria-labelledby="dialogo-titulo">
            <form method="dialog">
                <h3 id="dialogo-titulo" class="titulo-epico">⚜️ O Guardião</h3>
                <p id="dialogo-mensagem"></p>
                <div class="acoes">
                    <button value="cancelar" class="botao botao-secundario" autofocus>Cancelar</button>
                    <button value="confirmar" class="botao botao-perigo">Confirmar</button>
                </div>
            </form>
        </dialog>
        <script>
            (function () {
                var dialogo = document.getElementById('dialogo-confirmacao');
                document.addEventListener('submit', function (evento) {
                    var formulario = evento.target;
                    var mensagem = formulario.getAttribute('data-confirmar');
                    if (!mensagem) return;
                    evento.preventDefault();
                    if (!dialogo.showModal) {
                        if (window.confirm(mensagem)) formulario.submit();
                        return;
                    }
                    document.getElementById('dialogo-mensagem').textContent = mensagem;
                    dialogo.returnValue = '';
                    dialogo.onclose = function () {
                        if (dialogo.returnValue === 'confirmar') formulario.submit();
                    };
                    dialogo.showModal();
                });
            })();
        </script>
        {% block scripts %}{% endblock %}
    </body>
</html>
