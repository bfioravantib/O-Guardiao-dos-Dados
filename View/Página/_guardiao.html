
{% macro guardiao_svg(humor='indagando', classe='') %}

{% macro titulo_medieval() %}

                <stop offset="75%" stop-color="#ca8a04"/>
                <stop offset="100%" stop-color="#713f12"/>
            </linearGradient>
            <linearGradient id="faixa-vinho" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#580f16"/>
                <stop offset="50%" stop-color="#881b24"/>

                <stop offset="0%" stop-color="#173d52"/>

        <polygon points="24,48 396,48 412,82 396,116 24,116 8,82"
                 fill="url(#placa-escura)" stroke="url(#ouro-texto)" stroke-width="4"/>
